<div class="mainHeaderContainer">
  <div class="topHeader">
    <div class="headerSwitchContainer">
      <span class="headerChip">{{ menu?.isRest ? (isEl ? 'Εστιατόριο' : 'Resturant'): (isEl ? 'Παραλία' : 'Beach') }}</span>
      <label class="switch-toggle">
        <input
          class="switch-toggle__input"
          type="checkbox"
          [checked]="menu?.isRest"
          (change)="onMenuToggle($event)"
        >
        <span class="switch-toggle__slider"></span>
      </label>
    </div>

    <img alt="logo" class="imageL" [src]="logo">

    <div class="headerLanguageCont" (click)="onLanguageToggle()">
      <img alt="language" [src]="langIcon" class="headerLanguageIcon">
      <img alt="language flag" [src]="isEl ? elFlag : enFlag" class="headerFlag">
    </div>
  </div>

  <div class="headerLevTwo">
    <div *ngFor="let category of menu?.categories; index as i" class="headerCategory">
      <div
        class="categoryHeaderContainer"
        [class.selected]="selected === i"
        (click)="onCategoryClick(i)"
      >
        {{ category.title }}
      </div>
    </div>
  </div>
</div>
