# Full nginx.conf example for Glysteri local HTTPS.
# This version matches the default nginx.conf structure where `server {}` blocks
# live inside the top-level `http {}` block.

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP entrypoint: redirect old 8080 URL to HTTPS.
    server {
        listen       8080;
        server_name  10.10.11.15;

        return 308 https://$host$request_uri;
    }

    # HTTPS menu.
    server {
        listen       443 ssl;
        server_name  10.10.11.15;

        # Use absolute paths or paths relative to the nginx config prefix.
        # Change these if you place the files somewhere else.
        ssl_certificate      /etc/nginx/ssl/glisteri-local.cert.pem;
        ssl_certificate_key  /etc/nginx/ssl/glisteri-local.key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;

        # Point this to the Angular build folder copied from dist/glisteri_v2.
        root   /var/www/glisteri_v2;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Keep API calls HTTPS from the browser, then proxy internally to backend.
        location /api/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
